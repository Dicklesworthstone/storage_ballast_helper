[package]
name = "storage_ballast_helper"
version = "0.4.36"
edition = "2024"
license = "MIT"
description = "System service that prevents disk-full scenarios from coding agent swarms via ballast files, artifact scanning, and special location monitoring."
readme = "README.md"
keywords = ["disk", "ballast", "cleanup", "daemon", "storage"]
categories = ["command-line-utilities", "filesystem"]
[lib]
name = "storage_ballast_helper"
path = "src/lib.rs"
[[bin]]
name = "sbh"
path = "src/main.rs"
required-features = ["cli"]

[[bench]]
name = "macos_performance"
harness = false

[features]
# `tui` is intentionally NOT a default feature: the released binaries are built
# without it (CI uses --no-default-features --features cli,daemon,sqlite), and a
# default `cargo install --git` must resolve/build without the frankentui TUI
# crates. Build the TUI explicitly with `--features tui` (sbh#12).
default = ["cli", "daemon", "sqlite"]
cli = ["dep:clap", "dep:clap_complete", "dep:colored", "dep:crossterm", "sqlite", "daemon"]
daemon = ["dep:signal-hook"]
sqlite = ["dep:rusqlite"]
tui = ["dep:ftui", "dep:ftui-backend", "dep:ftui-tty"]
[dependencies]
# CLI (optional — gated behind "cli" feature)
clap = { version = "4.5", features = ["derive"], optional = true }
clap_complete = { version = "4.5", optional = true }
colored = { version = "3.0", optional = true }
crossterm = { version = "0.29", optional = true }
# Serialization (core)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
plist = "1.9.0"
# Pinned to 2.x deliberately: bincode 3.0.0 is not a usable release — its
# lib.rs is a single `compile_error!` pointing at https://xkcd.com/2347/,
# so any build that resolves it fails outright. It also drops the `serde`
# feature this crate needs. Do not "upgrade" to 3.x on a version-currency
# sweep; revisit only if a real 3.x ships.
bincode = { version = "2.0.1", features = ["serde"] }
# Database (optional — gated behind "sqlite" feature)
rusqlite = { version = "0.40", features = ["bundled", "functions"], optional = true }
# Error handling (core)
thiserror = "2.0"
# TUI (optional — gated behind "tui" feature).
# Sourced from the frankentui git repo at a pinned tag (matching the convention
# in cass/frankenterm) rather than a local /dp path, so `cargo install --git` and
# CI can resolve these off this VPS. The previous absolute-path deps broke any
# off-VPS source build because cargo reads optional deps during resolution
# regardless of which features are active (sbh#12).
ftui = { git = "https://github.com/Dicklesworthstone/frankentui", tag = "v0.4.1", default-features = false, optional = true }
ftui-backend = { git = "https://github.com/Dicklesworthstone/frankentui", tag = "v0.4.1", optional = true }
ftui-tty = { git = "https://github.com/Dicklesworthstone/frankentui", tag = "v0.4.1", optional = true }
# Timestamps (core)
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
# Concurrency (core — used by scanner walker, not just daemon)
parking_lot = "0.12"
crossbeam-channel = "0.5"
# Fast byte scanning (core)
memchr = "2.7"
# Pattern matching for artifact classification (core)
regex = "1.11"
# Supply-chain checksum verification (core)
sha2 = "0.11"
# Signal handling (optional — gated behind "daemon" feature)
signal-hook = { version = "0.4", optional = true }
# Ballast generation and randomized test fixtures (core)
rand = "0.10.1"
# Platform-specific
[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", features = ["event", "fs", "mount", "signal", "user"] }
libc = "0.2"
rustix = { version = "=1.1.4", features = ["fs"] }

[target.'cfg(target_os = "linux")'.dependencies]
inotify = { version = "0.11.1", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3.2", features = ["NSArray", "NSDictionary", "NSError", "NSString", "NSURL", "NSValue"] }
proc_pidinfo = "0.1.4"
sbh_mach = { path = "crates/sbh_mach" }
sysctl = "0.7.1"
whichdisk = "0.5"
[dev-dependencies]
tempfile = "3.17"
proptest = "1.6"
filetime = "0.2"
criterion = "0.8.2"
insta = { version = "1.47.2", default-features = false }
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unused = { level = "warn", priority = -1 }
[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_panics_doc = "allow"
missing_errors_doc = "allow"
missing_const_for_fn = "allow"
doc_markdown = "allow"
