name: Source-root safety

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - '.github/workflows/source-root-safety.yml'
  workflow_dispatch:
  # Also qualify the current main after a main-branch CI attempt completes.
  # This supports remote validation when an API-originated push emits no run.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: source-root-safety
  cancel-in-progress: false

jobs:
  source-root-safety:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Never execute a fork or an old attempt's source with this event.
          ref: main
          persist-credentials: false
      - name: Record exact source for reproducible validation
        run: |
          git rev-parse HEAD | tee source-root-validation-sha.txt
          git archive --format=tar --output=sbh-source.tar HEAD
      - name: Source-root policy and configuration regressions
        run: cargo test --locked --lib source_root
      - name: Type-check all targets
        run: cargo check --locked --all-targets
      - name: Check source-root formatting
        if: always()
        run: rustfmt --edition 2024 --check src/scanner/source_roots.rs src/scanner/deletion/source_root_tests.rs
      - name: Preserve validation source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-root-validation-source
          path: |
            sbh-source.tar
            source-root-validation-sha.txt
          retention-days: 3
